<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">DSH Pocket Connect — 随机地址，固定入口</title>
  <desc id="desc">独立部署的固定入口工具，自动跟随变化的隧道地址，每个用户拥有自己的入口。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#397cff"/><stop offset="1" stop-color="#2258d8"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#8299bf" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1278" height="358" rx="28" fill="url(#bg)" stroke="#dfe7f4"/>
  <circle cx="1200" cy="0" r="210" fill="#e4edff" opacity=".55"/>
  <g font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <rect x="52" y="45" width="48" height="48" rx="14" fill="url(#blue)"/>
    <text x="76" y="80" text-anchor="middle" font-size="38" font-weight="750" fill="white">c</text>
    <text x="116" y="77" font-size="31" font-weight="750" fill="#192c48">DSH Pocket Connect</text>
    <text x="54" y="153" font-size="42" font-weight="750" fill="#192c48">随机地址，<tspan fill="#2868ed">固定入口。</tspan></text>
    <text x="55" y="196" font-size="18" fill="#647792">为不断变化的公网 URL，保留一份长期使用的二维码。</text>
    <g font-size="14" fill="#45648f">
      <rect x="54" y="236" width="102" height="34" rx="17" fill="white" stroke="#dce6f6"/><text x="105" y="258" text-anchor="middle">独立部署</text>
      <rect x="168" y="236" width="102" height="34" rx="17" fill="white" stroke="#dce6f6"/><text x="219" y="258" text-anchor="middle">自动同步</text>
      <rect x="282" y="236" width="102" height="34" rx="17" fill="white" stroke="#dce6f6"/><text x="333" y="258" text-anchor="middle">MIT 开源</text>
    </g>
    <text x="55" y="315" font-size="11" letter-spacing="2" fill="#8a9bb4">ONE LINK. ALWAYS CONNECTED.</text>
    <rect x="718" y="42" width="510" height="276" rx="24" fill="white" stroke="#dce6f6"/>
    <text x="748" y="79" font-size="12" letter-spacing="1.5" fill="#8095b3">YOUR PERMANENT ENTRY</text>
    <rect x="748" y="101" width="450" height="72" rx="14" fill="#edf4ff" stroke="#cfddf6"/>
    <circle cx="775" cy="128" r="5" fill="#2868ed"/>
    <text x="791" y="134" font-size="17" font-weight="650" fill="#244e91">你的固定入口</text>
    <text x="770" y="157" font-size="12" fill="#6983aa">同一入口保持固定 · 新用户独立生成</text>
    <path d="M973 178V206" fill="none" stroke="#8299bf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="997" y="197" font-size="11" fill="#8095b3">跟随最新地址</text>
    <rect x="748" y="220" width="203" height="61" rx="12" fill="#f7f8fb" stroke="#e4e9f1"/>
    <text x="770" y="245" font-size="11" fill="#94a0b3">重启前</text><text x="770" y="266" font-size="14" fill="#70829b">随机地址 A</text>
    <path d="M962 251H982" stroke="#8299bf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="995" y="220" width="203" height="61" rx="12" fill="#edf9f5" stroke="#cceadf"/>
    <text x="1017" y="245" font-size="11" fill="#52a187">重启后</text><text x="1017" y="266" font-size="14" font-weight="650" fill="#237c61">随机地址 B</text>
  </g>
</svg>
